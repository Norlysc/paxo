project_id = "paxo-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3001"]
jwt_expiry = 3600
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.quote-photos]
public = false
file_size_limit = "10MiB"

[storage.buckets.project-files]
public = false
file_size_limit = "20MiB"

[storage.buckets.avatars]
public = true
file_size_limit = "5MiB"
